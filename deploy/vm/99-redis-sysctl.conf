# Redis 建議的核心參數（安裝到 /etc/sysctl.d/99-redis.conf）
# 每一項的理由見 docs/03-deploy-vm.md「OS 調校」

# fork 做 RDB/AOF rewrite 時允許記憶體超額配置，否則大資料集下 bgsave 會失敗
# （Redis 啟動日誌的第一個 WARNING 就是它）
vm.overcommit_memory = 1

# 監聽佇列上限；配合 redis.conf 的 tcp-backlog（取兩者較小值）
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 1024

# 儘量不用 swap：Redis 資料進 swap 就等於延遲爆炸
vm.swappiness = 1
