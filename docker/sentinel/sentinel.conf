# Redis Sentinel 設定（1 Master + 2 Replica + 3 Sentinel 練習環境）
#
# 兩個容器環境特有的重點：
# 1. Sentinel 會在執行期間改寫自己的設定檔（寫入 myid、發現的 replica / sentinel）。
#    docker-compose 會先把這個檔案複製到容器內可寫的位置再啟動，
#    三個 Sentinel 才不會互相覆蓋同一個 bind-mount 檔案。
# 2. Master 用「固定 IP」而不是容器名稱。Master 容器一停，Docker DNS 就解析不到名稱，
#    Sentinel 會因為 DNS 阻塞而進入 TILT 模式、暫停故障轉移（實測踩到的坑）。
#    因此 docker-compose-sentinel.yml 為每個節點指派了固定 IP（172.28.0.0/24）。
port 26379
bind 0.0.0.0
protected-mode no

# sentinel monitor <名稱> <Master IP> <port> <quorum>
# quorum = 2：至少 2 個 Sentinel 同意 Master 下線才會啟動故障轉移
sentinel monitor mymaster 172.28.0.10 6379 2

# 5 秒沒有回應 → 主觀下線（SDOWN）；quorum 個 Sentinel 都認為下線 → 客觀下線（ODOWN）
sentinel down-after-milliseconds mymaster 5000
# 故障轉移逾時（含重試間隔）
sentinel failover-timeout mymaster 10000
# 故障轉移後，同時向新 Master 重新同步的 replica 數量（1 = 一次一台，服務中斷最小）
sentinel parallel-syncs mymaster 1
